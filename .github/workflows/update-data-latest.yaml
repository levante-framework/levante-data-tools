on:
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:

name: Update levante_data_latest

permissions:
  contents: read

jobs:
  update-data-latest:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libcurl4-openssl-dev libudunits2-dev libgdal-dev

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.5.3'
          use-public-rspm: true

      - name: Set up renv
        uses: r-lib/actions/setup-renv@v2

      - name: Run update_levante_data_latest Redivis workflow
        run: Rscript scripts/processing/update_data_latest.R
        env:
          REDIVIS_API_TOKEN: ${{ secrets.REDIVIS_API_TOKEN }}
